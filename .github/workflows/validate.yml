name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Ruff lint
        run: uv run --extra dev ruff check .

      - name: Run unit tests
        run: uv run pytest tests/ -v

      - name: Check translation source freshness
        run: uv run python _source/translations.py status

      - name: Rebuild from accepted translations without model access
        run: |
          uv run python _source/build.py --strict
          git diff --exit-code -- en pt index.html sitemap.xml

      - name: Check internal links
        run: uv run python _source/link_checker.py

      - name: Validate generated HTML
        run: uv run --extra dev python _source/html_validator.py
