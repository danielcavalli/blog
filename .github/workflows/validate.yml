name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Reef conversations are private and this repository is public: nothing git stores may hold one.
      - name: No Reef conversation in what git stores
        run: node tools/git/conversations.mjs check

      - name: Tests
        run: node --test tools/
