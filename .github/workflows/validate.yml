name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Reef conversations are private and this repository is public: nothing git stores may hold one.
      - name: No Reef conversation in what git stores
        run: node tools/git/conversations.mjs check

      - name: Tests
        run: node --test "tools/**/*.test.*"

      # From here on the Maré Design System is needed. It is a private package: these steps run when
      # the repository has a token that can read it (NODE_AUTH_TOKEN: read:packages on mare-rio).
      - name: Is the design system readable?
        id: mds
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: echo "readable=${{ secrets.NODE_AUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Install
        if: steps.mds.outputs.readable == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        run: npm ci

      - name: Types
        if: steps.mds.outputs.readable == 'true'
        run: npm run check

      - name: The design system's conformance check
        if: steps.mds.outputs.readable == 'true'
        run: npx --no-install mare-conformance src

      - name: Build
        if: steps.mds.outputs.readable == 'true'
        run: npm run build
